# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/YOUR_DB_NAME?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# CORS
app.cors.allowed-origins=http://localhost:YOUR_FRONTEND_PORT

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT — generate a secure 256-bit hex secret: https://generate-random.org/encryption-key-generator
jwt.secret=YOUR_256BIT_HEX_SECRET
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Rate Limiting
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-minutes=15
