services:

  mysql:
    image: mysql:8.0
    container_name: YOUR_APP_NAME_mysql
    environment:
      MYSQL_ROOT_PASSWORD: YOUR_ROOT_PASSWORD
      MYSQL_DATABASE: YOUR_DB_NAME
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - YOUR_APP_NAME-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: YOUR_APP_NAME_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - YOUR_APP_NAME-net

  backend:
    build: ./backend
    container_name: YOUR_APP_NAME_backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    networks:
      - YOUR_APP_NAME-net

  frontend:
    build: ./frontend
    container_name: YOUR_APP_NAME_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - YOUR_APP_NAME-net

volumes:
  mysql_data:
  redis_data:

networks:
  YOUR_APP_NAME-net:
    driver: bridge